appId: com.ekram.md
productName: ekram.md
# electron-builder derives the binary name from productName, which would give
# "ekram.md.exe". The displayed name stays ekram.md; only the file is renamed.
executableName: ekram-md

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

# The Help topics are markdown files opened in the application itself. They sit
# outside the asar so they can be read with a plain path, and so someone can
# look at them without unpacking anything.
extraResources:
  - from: docs
    to: docs
    filter: ['**/*.md']

# The folder-search worker is loaded by worker_threads from
# join(__dirname, 'search-worker.js'), which points inside the asar archive.
#
# Tested both ways on Electron 44: search works whether or not this is
# unpacked, because Electron redirects the read. So this is insurance, not a
# fix - kept because worker-inside-asar behaviour has changed between Electron
# versions before, and unpacking one 3 KB file costs nothing. If it ever starts
# failing in a packaged build, this is the first thing to check.
asarUnpack:
  - out/main/search-worker.js

win:
  # Built from resources/logo.png by scripts/make-icons.py. Named here rather
  # than left to discovery: a missing icon would otherwise fall back, silently,
  # to Electron's own.
  icon: resources/icon.ico
  # The installer, and a portable zip for those who would rather not install:
  # unzip anywhere and run ekram-md.exe. The zip cannot update itself.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  # The zip's name; the installer's is set under nsis.
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # File association, so "Open with" and double-click reach the app.
  fileAssociations:
    - ext: md
      name: Markdown Document
      role: Editor
    - ext: markdown
      name: Markdown Document
      role: Editor

nsis:
  # No spaces: the name is part of the download's URL, and the update feed
  # (latest.yml) points at it.
  artifactName: ${productName}-Setup-${version}.${ext}
  # Settings, recovery journals and saved versions stay, so a reinstall picks
  # up where the user left off.
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ekram.md

# Where releases are published, and where the installed app looks for updates:
# electron-builder writes this into the app as app-update.yml. The release
# workflow publishes to a draft, which users never see until it is published.
publish:
  provider: github
  owner: m-ekram
  repo: md-reader
  releaseType: draft
