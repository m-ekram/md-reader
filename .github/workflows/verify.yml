name: verify

# Runs the suite on a clean Windows machine: typecheck, lint, unit tests and the
# end-to-end suite against the real app. That is all a push runs.
#
# The slower evidence — a startup benchmark against a baseline on the same
# machine, and screenshots with measurements of the views that need a human
# eye — runs only when asked for, from a manual run with `evidence` ticked. It
# roughly doubles a run's time, and Windows minutes on a private repository are
# billed at twice the rate.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      e2e_runs:
        description: How many times to run the end-to-end suite (stability check)
        default: '1'
      evidence:
        description: Also benchmark against baseline_ref and capture screenshots
        type: boolean
        default: false
      baseline_ref:
        description: What to benchmark against (a branch, tag or commit)
        default: origin/main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The benchmark checks out its baseline beside this commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        shell: bash
        run: |
          runs="${{ github.event.inputs.e2e_runs || '1' }}"
          npm run build
          for i in $(seq 1 "$runs"); do
            echo "::group::e2e run $i of $runs"
            npx vitest run --project e2e
            echo "::endgroup::"
          done

      # Same machine, same job: the only fair comparison. Numbers from different
      # runners, or from a laptop, are not comparable with each other.
      - name: Benchmark against baseline
        if: inputs.evidence
        # A shared runner may be slower than a desktop; the comparison between
        # the two rows is the result, not the budget check.
        continue-on-error: true
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline_ref || 'origin/main' }}
        run: |
          git worktree add ../baseline "$BASELINE"
          (cd ../baseline && npm ci --no-audit --no-fund && npm run build)
          echo "## baseline ($BASELINE)" | tee bench.txt
          (cd ../baseline && node "$GITHUB_WORKSPACE/scripts/bench.cjs" 6) | tee -a bench.txt
          npm run build
          echo "## this commit" | tee -a bench.txt
          node scripts/bench.cjs 6 | tee -a bench.txt
          # Typing in 5,000- and 10,000-line documents, on the two builds made
          # above. The script comes from this commit, so both are measured the
          # same way.
          echo "## typing, baseline ($BASELINE)" | tee -a bench.txt
          (cd ../baseline && node "$GITHUB_WORKSPACE/scripts/bench-typing.cjs" --no-build --repeat 3) | tee -a bench.txt
          echo "## typing, this commit" | tee -a bench.txt
          node scripts/bench-typing.cjs --no-build --repeat 3 | tee -a bench.txt

      # Taken even when a test failed, since that is when a picture helps most.
      - name: Screenshots
        if: always() && inputs.evidence
        run: |
          npm run build
          node scripts/capture.cjs artifacts/screens

      - uses: actions/upload-artifact@v4
        if: always() && inputs.evidence
        with:
          name: results
          path: |
            artifacts/screens
            bench.txt
          if-no-files-found: ignore
