name: verify

# Runs the whole suite on a clean Windows machine: typecheck, lint, unit tests,
# the end-to-end suite against the real app, a startup benchmark compared with
# main on the same machine, and screenshots of the views that need a human eye.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      e2e_runs:
        description: How many times to run the end-to-end suite (stability check)
        default: '1'

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src e2e --max-warnings 0

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        shell: bash
        run: |
          runs="${{ github.event.inputs.e2e_runs || '1' }}"
          npm run build
          for i in $(seq 1 "$runs"); do
            echo "::group::e2e run $i of $runs"
            npx vitest run --project e2e
            echo "::endgroup::"
          done

      # Same machine, same job: the only fair comparison. Numbers from different
      # runners, or from a laptop, are not comparable with each other.
      - name: Benchmark against main
        if: github.ref != 'refs/heads/main'
        # A shared runner may be slower than a desktop; the comparison between
        # the two rows is the result, not the budget check.
        continue-on-error: true
        shell: bash
        run: |
          git worktree add ../baseline origin/main
          (cd ../baseline && npm ci --no-audit --no-fund && npm run build)
          echo "## baseline (main)" | tee bench.txt
          (cd ../baseline && node "$GITHUB_WORKSPACE/scripts/bench.cjs" 6) | tee -a bench.txt
          npm run build
          echo "## this commit" | tee -a bench.txt
          node scripts/bench.cjs 6 | tee -a bench.txt

      - name: Screenshots
        if: always()
        run: |
          npm run build
          node scripts/capture.cjs artifacts/screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            artifacts/screens
            bench.txt
          if-no-files-found: ignore
